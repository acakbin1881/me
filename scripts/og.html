<!doctype html>
<!--
  Source for public/og.png (link preview, 1200x630).
  Regenerate: run `npm run build` once (fetches Switzer), then from the repo root:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new \
      --hide-scrollbars --window-size=1200,630 --force-device-scale-factor=1 \
      --screenshot=public/og.png "file://$PWD/scripts/og.html"
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>og</title>
<style>
  @font-face {
    font-family: "Switzer";
    src: url("../src/styles/fonts/Switzer-Variable.woff2") format("woff2");
    font-weight: 100 900;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #f6f6f3;
    color: #0c0c0b;
    font-family: "Switzer", sans-serif;
    padding: 44px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    -webkit-font-smoothing: antialiased;
  }
  .top, .bottom { font-size: 22px; font-weight: 500; line-height: 1; }
  .top { font-weight: 700; }
  h1 { font-weight: 500; font-size: 80px; line-height: 1.03; letter-spacing: -0.045em; }
  h1 span { display: block; white-space: nowrap; margin-left: calc(var(--i) * 170px); }
  h1 span:first-child { font-weight: 700; }
  /* The folded corner: the red back of the sheet. */
  .corner {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 250px;
    height: 250px;
    background: #da291c;
    clip-path: polygon(100% 0, 100% 100%, 0 100%);
  }
</style>
</head>
<body>
  <p class="top">Aras Akbin</p>
  <h1>
    <span style="--i:0">Aras Akbin</span>
    <span style="--i:1">builds Ostrom,</span>
    <span style="--i:2">represents Stellar,</span>
    <span style="--i:3">studies physics.</span>
  </h1>
  <p class="bottom">acakbin1881.github.io/me</p>
  <div class="corner"></div>
</body>
</html>
