# Publishes the site to GitHub Pages on every push to main (Vercel deploys separately).
# One-time setup on GitHub: Settings → Pages → Source: "GitHub Actions".
# The address comes from the Pages config: https://acakbin1881.github.io/me/ while the
# repo is called `me`, https://acakbin1881.github.io/ if it is renamed to acakbin1881.github.io.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - id: pages
        uses: actions/configure-pages@v5
      - uses: withastro/action@v6
        env:
          SITE: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
